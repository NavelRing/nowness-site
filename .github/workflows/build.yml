name: build site
# Rebuild the public site from the private nowness-feed repo after each morning issue.
on:
  schedule:
    - cron: "40 0-5,9,13 * * *"   # 08:40–13:40, 17:40, 21:40 Taipei
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch issues (read-only token)
        env:
          TOKEN: ${{ secrets.NOWNESS_FEED_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/NavelRing/nowness-feed.git" /tmp/feed
      - name: Test and build
        run: sh test_build.sh && python3 build.py /tmp/feed/NOWNESS .
      - name: Privacy check
        run: "! grep -rlE 'DIARY|/Users/|marchday004' --include=*.html . "
      - name: Commit generated pages only
        run: |
          git config user.name "nowness-bot"
          git config user.email "nowness-bot@users.noreply.github.com"
          git add index.html style.css archive 20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]
          git diff --cached --quiet || { git commit -m "site $(TZ=Asia/Taipei date +%F)" && git push; }
